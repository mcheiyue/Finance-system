spring.application.name=finance-tracker

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/finance_db}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

# CORS: 逗号分隔的显式允许源（不再使用 *）
app.cors.allowed-origins=${ALLOWED_ORIGINS:https://finance.mcheiyue.com,http://localhost:5173}

# Multipart 上传限制
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# CSV 导入行数上限
app.csv.import.max-rows=1000

# CSV 确认导入事务数上限
app.csv.confirm.max-transactions=500

app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}